<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - Foodie</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            Foodie
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="restaurants.html">
                Restaurants
            </a>

            <a href="orders.html">
                My Orders
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

        <a
            href="cart.html"
            class="cart-btn"
        >
            🛒 Cart
        </a>

    </header>


    <!-- Checkout -->

    <main class="container checkout-page">

        <h1>
            Checkout
        </h1>


        <div class="checkout-layout">


            <!-- Delivery Details -->

            <section class="checkout-form">

                <h2>
                    Delivery Details
                </h2>


                <form id="checkoutForm">


                    <!-- Name -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            maxlength="10"
                            required
                        >

                    </div>


                    <!-- Address -->

                    <div class="form-group">

                        <label for="address">
                            Delivery Address
                        </label>

                        <textarea
                            id="address"
                            rows="4"
                            placeholder="House No, Street, Area, City..."
                            required
                        ></textarea>

                    </div>


                    <!-- City -->

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Enter your city"
                            required
                        >

                    </div>


                    <!-- Pincode -->

                    <div class="form-group">

                        <label for="pincode">
                            Pincode
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            placeholder="Enter pincode"
                            maxlength="6"
                            required
                        >

                    </div>


                    <!-- Payment -->

                    <h2 class="payment-title">
                        Payment Method
                    </h2>


                    <div class="payment-options">


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="COD"
                                checked
                            >

                            <span>
                                💵 Cash on Delivery
                            </span>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="UPI"
                            >

                            <span>
                                📱 UPI
                            </span>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="CARD"
                            >

                            <span>
                                💳 Card
                            </span>

                        </label>


                    </div>


                    <button
                        type="submit"
                        class="place-order-btn"
                    >
                        Place Order
                    </button>

                </form>

            </section>


            <!-- Order Summary -->

            <aside class="checkout-summary">

                <h2>
                    Order Summary
                </h2>


                <!-- Items -->

                <div id="checkoutItems">

                    <!-- Items generated by JS -->

                </div>


                <hr>


                <div class="bill-row">

                    <span>
                        Item Total
                    </span>

                    <span id="checkoutItemTotal">
                        ₹0
                    </span>

                </div>


                <div class="bill-row">

                    <span>
                        Delivery Fee
                    </span>

                    <span id="checkoutDeliveryFee">
                        ₹0
                    </span>

                </div>


                <div class="bill-row">

                    <span>
                        Taxes
                    </span>

                    <span id="checkoutTaxes">
                        ₹0
                    </span>

                </div>


                <hr>


                <div class="bill-total">

                    <span>
                        Total
                    </span>

                    <span id="checkoutTotal">
                        ₹0
                    </span>

                </div>

            </aside>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <h2>
            Foodie
        </h2>

        <p>
            Your favourite food, delivered fast.
        </p>

        <p>
            © 2026 Foodie. All rights reserved.
        </p>

    </footer>


    <script src="css/js/checkout.js"></script>

</body>

</html>
