<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart - Foodie</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            Foodie
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="restaurants.html">
                Restaurants
            </a>

            <a href="orders.html">
                My Orders
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

        <a
            href="cart.html"
            class="cart-btn"
        >
            🛒 Cart
        </a>

    </header>


    <!-- Cart -->

    <main class="container cart-page">

        <h1>
            Your Cart
        </h1>


        <!-- Cart Content -->

        <div class="cart-layout">


            <!-- Cart Items -->

            <section class="cart-items">

                <div id="cartContainer">

                    <!-- Items generated by JavaScript -->

                </div>


                <!-- Empty Cart -->

                <div
                    id="emptyCart"
                    class="empty-cart"
                    style="display: none;"
                >

                    <div class="empty-cart-icon">
                        🛒
                    </div>

                    <h2>
                        Your cart is empty
                    </h2>

                    <p>
                        Add some delicious food to your cart.
                    </p>

                    <a
                        href="restaurants.html"
                        class="continue-shopping"
                    >
                        Browse Restaurants
                    </a>

                </div>

            </section>


            <!-- Bill -->

            <aside
                class="cart-summary"
                id="cartSummary"
            >

                <h2>
                    Bill Details
                </h2>


                <div class="bill-row">

                    <span>
                        Item Total
                    </span>

                    <span id="itemTotal">
                        ₹0
                    </span>

                </div>


                <div class="bill-row">

                    <span>
                        Delivery Fee
                    </span>

                    <span id="deliveryFee">
                        ₹0
                    </span>

                </div>


                <div class="bill-row">

                    <span>
                        Taxes
                    </span>

                    <span id="taxes">
                        ₹0
                    </span>

                </div>


                <hr>


                <div class="bill-total">

                    <span>
                        Total
                    </span>

                    <span id="totalAmount">
                        ₹0
                    </span>

                </div>


                <button
                    class="checkout-btn"
                    onclick="goToCheckout()"
                >
                    Proceed to Checkout
                </button>

            </aside>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <h2>
            Foodie
        </h2>

        <p>
            Your favourite food, delivered fast.
        </p>

        <p>
            © 2026 Foodie. All rights reserved.
        </p>

    </footer>


    <script src="css/js/cart.js"></script>

</body>

</html>
